# =============================================================================
# Ntfy — Servidor de notificaciones push
# =============================================================================
#
# Acceso web: http://<ip-raspberry>:8090
# Enviar notificación: curl -d "Mensaje" http://<ip-raspberry>:8090/mi-topic
# App móvil: https://ntfy.sh (Android/iOS) → suscribirse a tu servidor
#
# =============================================================================

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    
    user: "1000:1000"
    
    command: serve

    networks:
      - internal

    ports:
      - "0.0.0.0:8090:80/tcp"    # Interfaz web y API

    volumes:
      - ${VOLUMES_PATH:-./volumes}/ntfy/cache:/var/cache/ntfy
      - ${VOLUMES_PATH:-./volumes}/ntfy/etc:/etc/ntfy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

    security_opt:
      - no-new-privileges:true

    restart: on-failure:5

    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      - NTFY_BASE_URL=http://${NTFY_HOST:-localhost}:8090
      - NTFY_BEHIND_PROXY=false
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db

    env_file:
      - ../../.env

networks:
  internal:
    external: true
    name: rpi4_internal
