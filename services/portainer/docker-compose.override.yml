# =============================================================================
# Portainer — Panel web para gestionar Docker visualmente
# =============================================================================
#
# Acceso: https://<ip-raspberry>:9443
# Primera vez: crear usuario admin en el navegador
#
# ROOT_EXCEPTION: Portainer necesita acceso al socket de Docker para
# gestionar contenedores, imágenes, redes y volúmenes.
# =============================================================================

services:
  portainer:
    image: portainer/portainer-ce:2.20.3-alpine
    
    # ROOT_EXCEPTION: Requiere acceso al socket Docker (/var/run/docker.sock)
    
    networks:
      - internal

    ports:
      - "0.0.0.0:9443:9443/tcp"   # Panel web HTTPS

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${VOLUMES_PATH:-./volumes}/portainer:/data

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

    security_opt:
      - no-new-privileges:true

    restart: on-failure:5

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:9443/", "--no-check-certificate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
    external: true
    name: rpi4_internal
